# Vault stack on CT 102: SilverBullet wiki + git history. Notes: vault.md.
# Deployed at /opt/vault-stack/compose.yml in CT 102.
#
# The vault (former Obsidian/iCloud vault, now the single source of truth) is
# host /mnt/t7/vault, bound into CT 102 as mp10 /opt/vault. Files are owned by
# uid 1000 in CT 102 (host 101000), same as the old mail-triage poller.
#
# Deploy:  docker compose -f /opt/vault-stack/compose.yml up -d
services:
  # =========================================================
  # SilverBullet: browse/edit the vault in a browser.
  #   Web UI: http://vault.home  (direct: http://192.168.1.30:3030)
  #   Login:  SB_USER from vault.env
  # Service worker off: the default client syncs the whole space into the
  # browser for offline use, which is 19GB of photos/PDFs here.
  # =========================================================
  silverbullet:
    # -slim: no bundled headless Chromium. The full image runs a server-side
    # Chrome runtime that indexed all 19GB and pinned 1.3 CPUs at the 512MB
    # limit; without it, indexing happens in the browser (Markdown only).
    image: ghcr.io/silverbulletmd/silverbullet:latest-slim
    container_name: silverbullet
    env_file:
      - vault.env              # SB_USER (encrypted via transcrypt)
    environment:
      - TZ=Pacific/Auckland
      - PUID=1000
      - PGID=1000
      - SB_DISABLE_SERVICE_WORKER=true
      - SB_NAME=Vault
      # The default watcher re-read file contents across all 19GB (1.5GB per
      # 5s, at 2-3 CPUs). Polling only checks the listing.
      - SB_FS_WATCH=poll
      - SB_FS_POLL_INTERVAL=60
      - |
        SB_SPACE_IGNORE=.git/*
        *.tgz
        *.zip
    volumes:
      - /opt/vault:/data
    ports:
      - 3030:3000
    mem_limit: 512m
    restart: unless-stopped

  # =========================================================
  # vault-kb: MCP knowledge-base server for Hermes (vault/kb/server.py).
  #   MCP:  http://172.31.77.2:8770/mcp  (kbnet only, bearer KB_TOKEN)
  #   REST: /api/search, /api/append (retired mail-triage; unused)
  # Fixed IP on the kbnet network (nanobot's SSRF whitelist named this /32;
  # Hermes uses the same address). Not published on the LAN.
  # Excluded folders can't be read, searched or written through it.
  # =========================================================
  vault-kb:
    image: vault-kb:1
    build: ./kb
    container_name: vault-kb
    env_file:
      - vault.env              # KB_TOKEN (encrypted via transcrypt)
    environment:
      - TZ=Pacific/Auckland
      - VAULT=/vault
      - KB_DB=/index/kb.sqlite
      - KB_EXCLUDE=4. Archives,2. Areas/Identity
    volumes:
      - /opt/vault:/vault
      - ./index:/index
      - ./models:/models
    networks:
      kbnet:
        ipv4_address: 172.31.77.2
    mem_limit: 1g
    cpus: 1
    labels:
      - com.centurylinklabs.watchtower.enable=false
    restart: unless-stopped

  # =========================================================
  # Git history: commits text files (notes, canvases, CSVs) every 10 minutes
  # so edits by Doug, SilverBullet or Hermes can be reviewed and reverted.
  # Binary files are excluded via .git/info/exclude (see vault.md).
  # =========================================================
  vault-git:
    image: alpine/git:latest
    container_name: vault-git
    user: "1000:1000"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        cd /vault
        while true; do
          git add -A
          git diff --cached --quiet || git commit -q -m "auto: $$(date '+%Y-%m-%d %H:%M')"
          sleep 600
        done
    environment:
      # alpine/git has no tzdata, so give TZ as a POSIX rule (NZST/NZDT).
      - TZ=NZST-12NZDT,M9.5.0,M4.1.0/3
      - HOME=/tmp
      - GIT_AUTHOR_NAME=vault-git
      - GIT_AUTHOR_EMAIL=vault-git@homelab
      - GIT_COMMITTER_NAME=vault-git
      - GIT_COMMITTER_EMAIL=vault-git@homelab
    volumes:
      - /opt/vault:/vault
    mem_limit: 128m
    restart: unless-stopped

# Shared with hermes + hermes-gateway (hermes.compose.yml). Created once:
#   docker network create --subnet 172.31.77.0/29 kbnet
networks:
  kbnet:
    external: true

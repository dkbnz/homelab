services:
  # =========================================================
  # Tailscale — a single subnet router replaces the old per-app
  # ts-* sidecars. Remote access to every app is via the LAN
  # route + split DNS (*.home through AdGuard + Caddy).
  # =========================================================
  # Subnet router — advertises the LAN (192.168.1.0/24) to the tailnet so
  # remote devices reach AdGuard DNS and Caddy (every *.home URL) without
  # per-service sidecars. Two console-side steps (see jellystack.md):
  # approve the route, and add split DNS home -> 192.168.1.20.
  ts-subnet-router:
    image: tailscale/tailscale:latest
    container_name: ts-subnet-router
    hostname: homelab-lan
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY}
      - TS_HOSTNAME=homelab-lan
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_USERSPACE=false
      - TS_ROUTES=192.168.1.0/24,fd7a:115c:a1e0:b1a:0:1:c0a8:100/120  # 4via6 (site 1) for overlapping-LAN remote access
      - TS_EXTRA_ARGS=--accept-dns=false
    volumes:
      - ./appdata/ts-subnet-router/state:/var/lib/tailscale
    cap_add:
      - NET_ADMIN
      - NET_RAW
    devices:
      - /dev/net/tun
    sysctls:
      - net.ipv4.ip_forward=1
      - net.ipv6.conf.all.forwarding=1
    restart: unless-stopped

  jellyfin:
    image: lscr.io/linuxserver/jellyfin:latest
    container_name: jellyfin
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ./appdata/jellyfin:/config
      - ./media/tv:/data/tvshows
      - ./media/movies:/data/movies
      - ./media/music:/data/music
    devices:
      - /dev/dri:/dev/dri   # QSV transcoding (UHD 620, via CT 102 dev0 passthrough)
    restart: unless-stopped

  # Seerr replaced Jellyseerr (fallenbagel/jellyseerr, deprecated) 2026-10-31.
  # Runs as node (UID 1000), so ./appdata/seerr must be owned 1000:1000, and
  # the image has no init process of its own, hence init: true.
  seerr:
    image: ghcr.io/seerr-team/seerr:latest
    container_name: seerr
    init: true
    environment:
      - LOG_LEVEL=info
      - TZ=${TZ}
    volumes:
      - ./appdata/seerr:/app/config
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:5055/api/v1/settings/public || exit 1
      start_period: 20s
      timeout: 3s
      interval: 15s
      retries: 3
    restart: unless-stopped

  # Live IPTV proxy for Jellyfin. The provider allows ONE concurrent connection,
  # so tuliprox pulls each channel once and multicasts it to every viewer
  # (share_live_streams). Any number of viewers on the SAME channel is fine; two
  # DIFFERENT channels at once is not. Config in ./tuliprox/config, docs in
  # tuliprox.md. No ports — Jellyfin reaches it on the compose network.
  tuliprox:
    image: ghcr.io/euzu/tuliprox:latest   # = 3.3.0; do NOT use :dev, see tuliprox.md
    container_name: tuliprox
    environment:
      - TULIPROX_HOME=/app               # config.yml interpolates this
      - TZ=${TZ}
      - XTREAM_URL=${XTREAM_URL}
      - XTREAM_USERNAME=${XTREAM_USERNAME}
      - XTREAM_PASSWORD=${XTREAM_PASSWORD}
      - TULIPROX_PROXY_REWRITE_SECRET=${TULIPROX_PROXY_REWRITE_SECRET}
      - TULIPROX_JELLYFIN_PASSWORD=${TULIPROX_JELLYFIN_PASSWORD}
    volumes:
      # Distroless image runs as root, so these end up root-owned unlike the
      # rest of the stack. PUID/PGID do nothing here.
      - ./tuliprox/config:/app/config
      - ./tuliprox/data:/app/data
      - ./tuliprox/backup:/app/backup
    healthcheck:
      test: ["CMD", "/app/tuliprox", "--healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  # =========================================================
  # *arr suite + Prowlarr — LAN-only on phone (172.16.42.1)
  # =========================================================
  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ./appdata/sonarr:/config
      - ./media/tv:/tv
      - ./media/downloads:/downloads
    ports:
      - 8989:8989
    restart: unless-stopped

  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ./appdata/radarr:/config
      - ./media/movies:/movies
      - ./media/downloads:/downloads
    ports:
      - 7878:7878
    restart: unless-stopped

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ./appdata/prowlarr:/config
    ports:
      - 9696:9696
    restart: unless-stopped

  sabnzbd:
    image: lscr.io/linuxserver/sabnzbd:latest
    container_name: sabnzbd
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ./appdata/sabnzbd:/config
      - ./media/downloads:/downloads
    ports:
      - 8081:8080
    restart: unless-stopped

  # =========================================================
  # VPN + qBittorrent — qBit pinned to gluetun netns
  # qBit WebUI on phone LAN at http://172.16.42.1:8080
  # =========================================================
  gluetun:
    image: qmcgaw/gluetun:latest
    container_name: gluetun
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      - VPN_SERVICE_PROVIDER=surfshark
      - VPN_TYPE=wireguard
      - WIREGUARD_PRIVATE_KEY=${WIREGUARD_PRIVATE_KEY}
      - WIREGUARD_ADDRESSES=${WIREGUARD_ADDRESSES}
      - SERVER_COUNTRIES=${SURFSHARK_COUNTRY}
      - TZ=${TZ}
    volumes:
      - ./appdata/gluetun:/gluetun
    ports:
      - 8080:8080
      - 6881:6881
      - 6881:6881/udp
      - 8090:8090   # qbittorrent-exporter (rides this netns); Prometheus scrapes it
      - 5030:5030   # slskd web/API (rides this netns too)
      - 8097:8097   # stremio web UI + streaming server (rides this netns too)
    restart: unless-stopped

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    network_mode: "service:gluetun"
    depends_on:
      - gluetun
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - WEBUI_PORT=8080
    volumes:
      - ./appdata/qbittorrent:/config
      - ./media/downloads:/downloads
    restart: unless-stopped

  # Stremio: ephemeral torrent streaming (web player + streaming server in one
  # image, nginx in front). Shares gluetun's netns so torrent traffic goes
  # through the VPN. Its default port 8080 clashes with qBittorrent in this
  # netns, so the web UI listens on 8097. Caddy serves it as stream.home.
  stremio:
    image: tsaridas/stremio-docker:latest
    container_name: stremio
    network_mode: "service:gluetun"
    depends_on:
      - gluetun
    environment:
      - NO_CORS=1
      - AUTO_SERVER_URL=1
      - WEBUI_INTERNAL_PORT=8097
      - CASTING_DISABLED=1
    volumes:
      - ./appdata/stremio:/root/.stremio-server   # settings + torrent cache (T7)
    devices:
      - /dev/dri:/dev/dri   # QSV for the server's transcoder
    restart: unless-stopped

  # Prometheus exporter for qBittorrent. Lives in gluetun's netns (same as qBit)
  # so it reaches the WebUI on localhost; cross-project network_mode isn't
  # possible, which is why it's here and not in monitoring.compose.yml.
  qbittorrent-exporter:
    image: ghcr.io/esanchezm/prometheus-qbittorrent-exporter:latest
    container_name: qbittorrent-exporter
    network_mode: "service:gluetun"
    depends_on:
      - gluetun
      - qbittorrent
    environment:
      - QBITTORRENT_HOST=localhost
      - QBITTORRENT_PORT=8080
      - QBITTORRENT_USER=${QBIT_USER}
      - QBITTORRENT_PASS=${QBIT_PASS}
      - EXPORTER_PORT=8090
    restart: unless-stopped

  # =========================================================
  # FlareSolverr — Cloudflare bypass for Prowlarr indexers
  # =========================================================
  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    dns:
      - 1.1.1.1
      - 8.8.8.8
    environment:
      - LOG_LEVEL=info
      - TZ=${TZ}
    ports:
      - 8191:8191
    restart: unless-stopped

  # =========================================================
  # Unpackerr — auto-extract obfuscated/RAR releases for arrs
  # =========================================================
  unpackerr:
    image: golift/unpackerr:latest
    container_name: unpackerr
    user: ${PUID}:${PGID}
    environment:
      - TZ=${TZ}
      - UN_SONARR_0_URL=http://sonarr:8989
      - UN_SONARR_0_API_KEY=${SONARR_API_KEY}
      - UN_SONARR_0_PATHS_0=/downloads/tv
      - UN_RADARR_0_URL=http://radarr:7878
      - UN_RADARR_0_API_KEY=${RADARR_API_KEY}
      - UN_RADARR_0_PATHS_0=/downloads/movies
    volumes:
      - ./appdata/unpackerr:/config
      - ./media/downloads:/downloads
    restart: unless-stopped

  # =========================================================
  # Music pipeline: Lidarr -> (usenet/torrents via Prowlarr) or
  # (Soulseek via Soularr + slskd). Navidrome serves the library.
  # Requests go directly in the Lidarr UI (http://lidarr.home) -
  # Seerr music support is still preview-only, not in stable.
  # =========================================================
  lidarr:
    image: lscr.io/linuxserver/lidarr:latest
    container_name: lidarr
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ./appdata/lidarr:/config
      - ./media/music:/music
      - ./media/downloads:/downloads
    ports:
      - 8686:8686
    restart: unless-stopped

  # slskd — headless Soulseek client. Rides gluetun's netns like qBittorrent so
  # all Soulseek traffic goes over the VPN; web/API published via gluetun :5030.
  # API key for Soularr lives in appdata/slskd/slskd.yml (generated at deploy
  # from jellystack/slskd/slskd.yml.tmpl — see jellystack.md); everything else
  # is configured here via env. Shares the music library back (read-only).
  slskd:
    image: slskd/slskd:latest
    container_name: slskd
    network_mode: "service:gluetun"
    depends_on:
      - gluetun
    user: ${PUID}:${PGID}
    environment:
      - SLSKD_SLSK_USERNAME=${SLSK_USER}
      - SLSKD_SLSK_PASSWORD=${SLSK_PASS}
      - SLSKD_USERNAME=${SLSKD_WEB_USER}
      - SLSKD_PASSWORD=${SLSKD_WEB_PASS}
      - SLSKD_DOWNLOADS_DIR=/downloads/complete
      - SLSKD_INCOMPLETE_DIR=/downloads/incomplete
      - SLSKD_SHARED_DIR=/music
      - SLSKD_METRICS=true
      - SLSKD_METRICS_NO_AUTH=true   # LAN/VPN only, same call as jellyfin /metrics
      - TZ=${TZ}
    volumes:
      - ./appdata/slskd:/app
      - ./media/downloads/slskd:/downloads
      - ./media/music:/music:ro
    restart: unless-stopped

  # Soularr — bridges Lidarr's wanted list to slskd. Polls Lidarr, searches
  # Soulseek, downloads via slskd, triggers the Lidarr import. Config (API
  # keys) in appdata/soularr/config.ini, generated at deploy from
  # jellystack/soularr/config.ini.tmpl.
  soularr:
    image: mrusse08/soularr:latest
    container_name: soularr
    user: ${PUID}:${PGID}
    environment:
      - TZ=${TZ}
      - SCRIPT_INTERVAL=300
    volumes:
      - ./appdata/soularr:/data
      - ./media/downloads:/downloads
    depends_on:
      - lidarr
    restart: unless-stopped

  # Navidrome — music server (Subsonic API). Reads the same library Lidarr
  # manages. http://navidrome.home everywhere (LAN direct, remote via the
  # subnet router).
  navidrome:
    image: deluan/navidrome:latest
    container_name: navidrome
    user: ${PUID}:${PGID}
    environment:
      - ND_MUSICFOLDER=/music
      - ND_SCANSCHEDULE=1h
      - ND_PROMETHEUS_ENABLED=true
      - TZ=${TZ}
    volumes:
      - ./appdata/navidrome:/data
      - ./media/music:/music:ro
    restart: unless-stopped

  # Reverse proxy for clean local URLs (http://jellyfin.home, http://seerr.home).
  # Names resolve via AdGuard DNS rewrites (*.home -> 192.168.1.30).
  caddy:
    image: caddy:2
    container_name: caddy
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - /opt/hermes/caddy:/etc/caddy/hermes:ro   # *.home routes Hermes adds (hermes.md)
      - ./caddy/data:/data
      - ./caddy/config:/config
    depends_on:
      - jellyfin
      - seerr

# Homepage tiles. Deployed to /opt/homepage/config in CT 102. Notes: homepage.md.
#
# href       = what the tile opens in your browser (the Caddy .home name)
# siteMonitor/widget url = what the homepage container itself calls. Jellystack
#              apps are reached by container name (homepage joins jellystack_default);
#              everything else by LAN IP and published port.
# {{HOMEPAGE_VAR_*}} values come from homepage.env (encrypted via transcrypt).
# A widget whose credentials are still blank shows an API error until filled in.

- Media:
    - Jellyfin:
        icon: jellyfin.png
        href: http://jellyfin.home
        description: Movies, TV, live TV
        siteMonitor: http://jellyfin:8096
        widget:
          type: jellyfin
          url: http://jellyfin:8096
          key: "{{HOMEPAGE_VAR_JELLYFIN_KEY}}"
          enableBlocks: true
          enableNowPlaying: true
    - Seerr:
        icon: jellyseerr.png
        href: http://seerr.home
        description: Request movies and TV
        siteMonitor: http://seerr:5055
        widget:
          type: jellyseerr
          url: http://seerr:5055
          key: "{{HOMEPAGE_VAR_JELLYSEERR_KEY}}"
    - Navidrome:
        icon: navidrome.png
        href: http://navidrome.home
        description: Music streaming
        siteMonitor: http://navidrome:4533
        widget:
          type: navidrome
          url: http://navidrome:4533
          user: "{{HOMEPAGE_VAR_NAVIDROME_USER}}"
          token: "{{HOMEPAGE_VAR_NAVIDROME_TOKEN}}"
          salt: "{{HOMEPAGE_VAR_NAVIDROME_SALT}}"

